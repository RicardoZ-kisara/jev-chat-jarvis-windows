name: Windows desktop
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:ntqq
      - run: .\resources\ntqq\Jev.NtqqBridge.exe --self-test
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Jev-Chat-Windows-x64
          path: windows/dist/*.exe
          if-no-files-found: error
